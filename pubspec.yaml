name: final_project
description: SneakShop, a Flutter sneaker store for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  http: ^1.6.0
  connectivity_plus: ^6.1.5
  app_links: ^6.4.1
  sqflite: ^2.4.5
  path: ^1.9.1
  bcrypt: ^1.2.0
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/sneakers/nike_air_max/
    - assets/sneakers/classic_low_white/
    - assets/sneakers/court_classic/
    - assets/sneakers/puma_run/
    - assets/sneakers/retro_street/
    - assets/sneakers/high_top_one/
